<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrar contenido | Correduría Pública No. 2</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="admin-panel">
    <h1>Administrar contenido</h1>
    <p>Correduría Pública Número 2 de la Plaza del Estado de Morelos</p>

    <section class="admin-form">
      <h2>Agregar publicación</h2>

      <label for="titulo">Título</label>
      <input type="text" id="titulo" placeholder="Título de la publicación">

      <label for="tipo">Tipo de contenido</label>
      <select id="tipo">
        <option value="infografia">Infografía</option>
        <option value="video">Video</option>
      </select>

      <label for="archivo">Seleccionar archivo</label>
      <input type="file" id="archivo" accept="image/*,video/*">

      <label for="fecha">Fecha</label>
      <input type="date" id="fecha">

      <button type="button" id="btn-publicar">
        Publicar
      </button>
    </section>

    <section class="admin-listado">
      <h2>Contenido publicado</h2>
      <p>Aquí podrás consultar y eliminar las publicaciones existentes.</p>

      <div id="lista-publicaciones"></div>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
